<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immersive Music Experience | Taiwo Heard</title>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <style>
        :root {
            /* Chill Mode Colors */
            --chill-primary: #6B73FF;
            --chill-secondary: #9DCEFF;
            --chill-tertiary: #C2FFFE;
            --chill-accent: #FFECD1;
            
            /* Dance Party Colors */
            --dance-primary: #FF006E;
            --dance-secondary: #FB5607;
            --dance-tertiary: #FFBE0B;
            --dance-accent: #8338EC;
            --dance-highlight: #3A86FF;
            
            /* Strange Mode Colors */
            --strange-primary: #FF00FF;
            --strange-secondary: #00FFFF;
            --strange-tertiary: #FFFF00;
            
            /* Layout */
            --knob-size: 150px;
            --video-width: 400px;
            --video-height: 225px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white;
            overflow-x: hidden;
            cursor: none;
        }
        
        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid var(--chill-primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: all 0.1s ease;
            mix-blend-mode: difference;
        }
        
        /* Background Layers */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .bg-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(107, 115, 255, 0.1) 2px, transparent 2px);
            background-size: 50px 50px;
            animation: float 20s infinite linear;
        }
        
        .bg-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .bg-shape {
            position: absolute;
            background: linear-gradient(45deg, var(--chill-primary), var(--chill-secondary));
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.3;
            animation: breathe 4s ease-in-out infinite;
        }
        
        .bg-shape:nth-child(1) {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .bg-shape:nth-child(2) {
            width: 200px;
            height: 200px;
            top: 60%;
            right: 20%;
            animation-delay: 1s;
        }
        
        .bg-shape:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 30%;
            right: 40%;
            animation-delay: 2s;
        }
        
        /* Master Control Knob */
        .master-control {
            position: fixed;
            top: 50%;
            right: 100px;
            transform: translateY(-50%);
            z-index: 1000;
            cursor: grab;
        }
        
        .master-control:active {
            cursor: grabbing;
        }
        
        .knob-container {
            width: var(--knob-size);
            height: var(--knob-size);
            position: relative;
            cursor: pointer;
        }
        
        .knob {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                var(--chill-primary) 0deg 120deg,
                var(--dance-primary) 120deg 240deg,
                var(--strange-primary) 240deg 360deg
            );
            position: relative;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 
                0 0 30px rgba(107, 115, 255, 0.5),
                inset 0 0 30px rgba(255, 255, 255, 0.1);
            animation: knobGlow 3s ease-in-out infinite;
        }
        
        .knob::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(0,0,0,0.8), rgba(0,0,0,0.4));
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        
        .knob-pointer {
            position: absolute;
            top: 10px;
            left: 50%;
            width: 4px;
            height: 30px;
            background: white;
            border-radius: 2px;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }
        
        .mode-label {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }
        
        .mode-label.chill {
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--chill-primary);
        }
        
        .mode-label.dance {
            bottom: -10px;
            right: -30px;
            color: var(--dance-primary);
        }
        
        .mode-label.strange {
            bottom: -10px;
            left: -30px;
            color: var(--strange-primary);
        }
        
        /* Music Player */
        .music-player {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px 40px;
            border: 2px solid var(--chill-primary);
            z-index: 1000;
            min-width: 400px;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .player-info {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .track-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .track-artist {
            font-size: 14px;
            opacity: 0.7;
        }
        
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .control-btn {
            background: none;
            border: 2px solid var(--chill-primary);
            color: var(--chill-primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
        }
        
        .control-btn:hover {
            background: var(--chill-primary);
            color: white;
            transform: scale(1.1);
        }
        
        .play-btn {
            width: 60px;
            height: 60px;
            font-size: 24px;
        }
        
        .waveform {
            height: 60px;
            background: linear-gradient(90deg, var(--chill-primary), var(--chill-secondary));
            border-radius: 10px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        
        .waveform::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 30%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            animation: waveProgress 3s linear infinite;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--chill-primary);
            width: 30%;
            transition: width 0.1s ease;
            animation: progressMove 3s linear infinite;
        }
        
        /* Video Grid */
        .video-container {
            padding: 100px 50px;
            min-height: 100vh;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .video-item {
            position: relative;
            transform-origin: center;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            animation: videoFloat 6s ease-in-out infinite;
        }
        
        .video-item:nth-child(odd) {
            animation-delay: 1s;
        }
        
        .video-item:nth-child(even) {
            animation-delay: 2s;
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.3),
                0 0 30px var(--chill-primary);
            transition: all 0.4s ease;
        }
        
        .video-wrapper:hover {
            transform: scale(1.05);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 0 50px var(--chill-primary);
        }
        
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .video-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: white;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        
        .video-wrapper:hover .video-overlay {
            transform: translateY(0);
        }
        
        .video-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .video-description {
            font-size: 14px;
            opacity: 0.8;
        }
        
        /* Mode-Specific Styles */
        body.chill-mode {
            --primary-color: var(--chill-primary);
            --secondary-color: var(--chill-secondary);
        }
        
        body.chill-mode .bg-shape {
            background: linear-gradient(45deg, var(--chill-primary), var(--chill-secondary));
        }
        
        body.chill-mode .video-item {
            transform: rotate(0deg);
            animation: videoFloatChill 8s ease-in-out infinite;
        }
        
        body.dance-mode {
            --primary-color: var(--dance-primary);
            --secondary-color: var(--dance-secondary);
        }
        
        body.dance-mode .bg-shape {
            background: linear-gradient(45deg, var(--dance-primary), var(--dance-tertiary));
            animation: danceParticles 2s ease-in-out infinite;
        }
        
        body.dance-mode .video-item:nth-child(odd) {
            transform: rotate(8deg);
            animation: videoPulseDance 1.5s ease-in-out infinite;
        }
        
        body.dance-mode .video-item:nth-child(even) {
            transform: rotate(-5deg);
            animation: videoPulseDance 1.5s ease-in-out infinite 0.5s;
        }
        
        body.dance-mode .video-wrapper {
            border: 3px solid var(--dance-primary);
            box-shadow: 
                0 0 30px var(--dance-primary),
                0 0 60px var(--dance-secondary);
        }
        
        body.strange-mode {
            --primary-color: var(--strange-primary);
            --secondary-color: var(--strange-secondary);
        }
        
        body.strange-mode .bg-shape {
            background: linear-gradient(45deg, var(--strange-primary), var(--strange-secondary));
            animation: strangeGlitch 0.8s ease-in-out infinite;
            filter: blur(20px) hue-rotate(90deg);
        }
        
        body.strange-mode .video-item {
            animation: videoGlitch 3s ease-in-out infinite;
        }
        
        body.strange-mode .video-item:nth-child(3n) {
            transform: rotate(25deg) skew(5deg);
        }
        
        body.strange-mode .video-item:nth-child(3n+1) {
            transform: rotate(-15deg) skew(-3deg);
        }
        
        body.strange-mode .video-wrapper {
            border-radius: 0;
            clip-path: polygon(10% 0%, 90% 0%, 100% 70%, 75% 100%, 25% 100%, 0% 30%);
            filter: hue-rotate(45deg) saturate(150%);
        }
        
        /* Responsive Design */
        @media (max-width: 1200px) {
            :root {
                --knob-size: 120px;
                --video-width: 350px;
            }
            
            .master-control {
                right: 50px;
            }
            
            .video-grid {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
                gap: 30px;
            }
        }
        
        @media (max-width: 768px) {
            :root {
                --knob-size: 100px;
                --video-width: 300px;
            }
            
            .master-control {
                right: 20px;
                top: 60%;
            }
            
            .video-container {
                padding: 50px 20px;
            }
            
            .video-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .music-player {
                min-width: 320px;
                padding: 15px 20px;
                bottom: 20px;
            }
        }
        
        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }
        
        @keyframes knobGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(107, 115, 255, 0.5), inset 0 0 30px rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 0 50px rgba(107, 115, 255, 0.8), inset 0 0 30px rgba(255, 255, 255, 0.2); }
        }
        
        @keyframes videoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes videoFloatChill {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.02); }
        }
        
        @keyframes videoPulseDance {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        
        @keyframes videoGlitch {
            0%, 100% { transform: translateX(0px) skew(0deg); filter: hue-rotate(0deg); }
            20% { transform: translateX(-2px) skew(1deg); filter: hue-rotate(90deg); }
            40% { transform: translateX(2px) skew(-1deg); filter: hue-rotate(180deg); }
            60% { transform: translateX(-1px) skew(0.5deg); filter: hue-rotate(270deg); }
            80% { transform: translateX(1px) skew(-0.5deg); filter: hue-rotate(360deg); }
        }
        
        @keyframes danceParticles {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); }
        }
        
        @keyframes strangeGlitch {
            0%, 100% { filter: blur(20px) hue-rotate(0deg); }
            25% { filter: blur(30px) hue-rotate(90deg); }
            50% { filter: blur(15px) hue-rotate(180deg); }
            75% { filter: blur(25px) hue-rotate(270deg); }
        }
        
        @keyframes waveProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }
        
        @keyframes progressMove {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* Focus indicators */
        .video-wrapper:focus-within,
        .control-btn:focus,
        .knob:focus {
            outline: 3px solid var(--primary-color, var(--chill-primary));
            outline-offset: 4px;
        }
    </style>
</head>

        const customCursor = document.querySelector('.custom-cursor');
        
        // Initialize
        gsap.registerPlugin(ScrollTrigger);
        
        // Custom cursor
        document.addEventListener('mousemove', (e) => {
            gsap.to(customCursor, {
                x: e.clientX - 10,
                y: e.clientY - 10,
                duration: 0.1
            });
        });
        
        // Knob interaction
        let isDragging = false;
        let startAngle = 0;
        
        function getAngle(e, element) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            return Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
        }
        
        function updateMode(rotation) {
            const normalizedRotation = ((rotation % 360) + 360) % 360;
            let newMode = currentMode;
            
            if (normalizedRotation >= 0 && normalizedRotation < 120) {
                newMode = 'chill';
            } else if (normalizedRotation >= 120 && normalizedRotation < 240) {
                newMode = 'dance';
            } else {
                newMode = 'strange';
            }
            
            if (newMode !== currentMode) {
                currentMode = newMode;
                currentTrackIndex = 0;
                switchMode(newMode);
                loadTrack();
            }
        }
        
        knob.addEventListener('mousedown', (e) => {
            isDragging = true;
            startAngle = getAngle(e, knob);
            knob.style.cursor = 'grabbing';
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const currentAngle = getAngle(e, knob);
                const deltaAngle = currentAngle - startAngle;
                knobRotation += deltaAngle;
                
                gsap.to(knob, {
                    rotation: knobRotation,
                    duration: 0.1
                });
                
                updateMode(knobRotation);
                startAngle = currentAngle;
            }
        });
        
        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                knob.style.cursor = 'grab';
                
                // Snap to nearest mode
                const snapAngle = Math.round(knobRotation / 120) * 120;
                gsap.to(knob, {
                    rotation: snapAngle,
                    duration: 0.5,
                    ease: "back.out(1.7)"
                });
                knobRotation = snapAngle;
                updateMode(snapAngle);
            }
        });
        
        // Keyboard navigation
        knob.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                knobRotation -= 120;
                gsap.to(knob, { rotation: knobRotation, duration: 0.5 });
                updateMode(knobRotation);
            } else if (e.key === 'ArrowRight') {
                knobRotation += 120;
                gsap.to(knob, { rotation: knobRotation, duration: 0.5 });
                updateMode(knobRotation);
            }
        });
        
        // Mode switching
        function switchMode(mode) {
            body.className = `${mode}-mode`;
            
            // Update CSS custom properties
            const root = document.documentElement;
            switch(mode) {
                case 'chill':
                    root.style.setProperty('--primary-color', 'var(--chill-primary)');
                    root.style.setProperty('--secondary-color', 'var(--chill-secondary)');
                    break;
                case 'dance':
                    root.style.setProperty('--primary-color', 'var(--dance-primary)');
                    root.style.setProperty('--secondary-color', 'var(--dance-secondary)');
                    break;
                case 'strange':
                    root.style.setProperty('--primary-color', 'var(--strange-primary)');
                    root.style.setProperty('--secondary-color', 'var(--strange-secondary)');
                    break;
            }
            
            loadVideos(mode);
            updatePlayerTheme(mode);
            
            // Trigger layout animation
            gsap.fromTo('.video-item', 
                { opacity: 0, scale: 0.8, rotation: 0 },
                { 
                    opacity: 1, 
                    scale: 1, 
                    rotation: mode === 'dance' ? (i) => (i % 2 === 0 ? 8 : -5) : 0,
                    duration: 0.8,
                    stagger: 0.15,
                    ease: "back.out(1.7)"
                }
            );
        }
        
        // Video loading with lazy loading
        function loadVideos(mode) {
            const videos = videoData[mode];
            videoGrid.innerHTML = '';
            
            videos.forEach((video, index) => {
                const videoItem = document.createElement('div');
                videoItem.className = 'video-item';
                videoItem.innerHTML = `
                    <div class="video-wrapper">
                        <div class="video-placeholder" data-video-id="${video.id}" data-index="${index}">
                            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px;">▶</div>
                        </div>
                        <div class="video-overlay">
                            <div class="video-title">${video.title}</div>
                            <div class="video-description">${video.description}</div>
                        </div>
                    </div>
                `;
                videoGrid.appendChild(videoItem);
            });
            
            // Setup intersection observer for lazy loading
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const placeholder = entry.target.querySelector('.video-placeholder');
                        if (placeholder) {
                            loadVideo(placeholder);
                            observer.unobserve(entry.target);
                        }
                    }
                });
            }, { rootMargin: '200px' });
            
            document.querySelectorAll('.video-item').forEach(item => {
                observer.observe(item);
            });
        }
        
        function loadVideo(placeholder) {
            const videoId = placeholder.dataset.videoId;
            const iframe = document.createElement('iframe');
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=0&mute=1&controls=1&rel=0`;
            iframe.allowFullscreen = true;
            iframe.loading = 'lazy';
            
            placeholder.parentNode.replaceChild(iframe, placeholder);
        }
        
        // Music player functionality
        function loadTrack() {
            const track = musicData[currentMode][currentTrackIndex];
            const folderName = currentMode === 'dance' ? 'Dance Rave' : currentMode.charAt(0).toUpperCase() + currentMode.slice(1);
            
            // Use relative paths for web compatibility
            audioPlayer.src = `Music tracks/${folderName}/${track.file}`;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            
            // Update aria labels for accessibility
            audioPlayer.setAttribute('aria-label', `Now playing: ${track.title} by ${track.artist}`);
        }
        
        function updatePlayerTheme(mode) {
            const player = document.querySelector('.music-player');
            const controlBtns = document.querySelectorAll('.control-btn');
            const waveform = document.querySelector('.waveform');
            const progressFill = document.querySelector('.progress-fill');
            
            let primaryColor, secondaryColor;
            
            switch(mode) {
                case 'chill':
                    primaryColor = 'var(--chill-primary)';
                    secondaryColor = 'var(--chill-secondary)';
                    break;
                case 'dance':
                    primaryColor = 'var(--dance-primary)';
                    secondaryColor = 'var(--dance-secondary)';
                    break;
                case 'strange':
                    primaryColor = 'var(--strange-primary)';
                    secondaryColor = 'var(--strange-secondary)';
                    break;
            }
            
            player.style.borderColor = primaryColor;
            waveform.style.background = `linear-gradient(90deg, ${primaryColor}, ${secondaryColor})`;
            progressFill.style.background = primaryColor;
            
            controlBtns.forEach(btn => {
                btn.style.borderColor = primaryColor;
                btn.style.color = primaryColor;
            });
        }
        
        // Audio controls
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audioPlayer.pause();
                playBtn.innerHTML = '▶';
                isPlaying = false;
            } else {
                audioPlayer.play();
                playBtn.innerHTML = '⏸';
                isPlaying = true;
            }
        });
        
        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + musicData[currentMode].length) % musicData[currentMode].length;
            loadTrack();
            if (isPlaying) audioPlayer.play();
        });
        
        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % musicData[currentMode].length;
            loadTrack();
            if (isPlaying) audioPlayer.play();
        });
        
        shuffleBtn.addEventListener('click', () => {
            currentTrackIndex = Math.floor(Math.random() * musicData[currentMode].length);
            loadTrack();
            if (isPlaying) audioPlayer.play();
            updateURL();
        });
        
        shareBtn.addEventListener('click', async () => {
            const shareData = {
                title: `${trackTitle.textContent} - Immersive Music Experience`,
                text: `Check out this ${currentMode} track by ${trackArtist.textContent}!`,
                url: window.location.href
            };
            
            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    // Fallback: copy to clipboard
                    await navigator.clipboard.writeText(window.location.href);
                    
                    // Visual feedback
                    shareBtn.innerHTML = '✓';
                    setTimeout(() => {
                        shareBtn.innerHTML = '🔗';
                    }, 2000);
                }
            } catch (err) {
                console.log('Share failed:', err);
            }
        });
        
        // Audio progress
        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressFill.style.width = `${progress}%`;
            }
        });
        
        audioPlayer.addEventListener('ended', () => {
            nextBtn.click();
        });
        
        // Scroll animations
        gsap.utils.toArray('.video-item').forEach((item, i) => {
            gsap.fromTo(item, 
                { y: 100, opacity: 0 },
                {
                    y: 0,
                    opacity: 1,
                    duration: 1,
                    scrollTrigger: {
                        trigger: item,
                        start: "top 90%",
                        end: "bottom 10%",
                        toggleActions: "play none none reverse"
                    }
                }
            );
        });
        
        // Parallax effect
        gsap.to('.bg-particles', {
            y: -100,
            scrollTrigger: {
                trigger: body,
                start: 'top top',
                end: 'bottom top',
                scrub: 1
            }
        });
        
        gsap.utils.toArray('.bg-shape').forEach((shape, i) => {
            gsap.to(shape, {
                y: -50 * (i + 1),
                rotation: 360,
                scrollTrigger: {
                    trigger: body,
                    start: 'top top',
                    end: 'bottom top',
                    scrub: 2
                }
            });
        });
        
        // URL state management for sharing
        function updateURL() {
            const url = new URL(window.location);
            url.searchParams.set('mode', currentMode);
            url.searchParams.set('track', currentTrackIndex);
            window.history.replaceState({}, '', url);
        }
        
        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            const urlMode = params.get('mode');
            const urlTrack = params.get('track');
            
            if (urlMode && ['chill', 'dance', 'strange'].includes(urlMode)) {
                currentMode = urlMode;
                const modeIndex = ['chill', 'dance', 'strange'].indexOf(urlMode);
                knobRotation = modeIndex * 120;
                gsap.set(knob, { rotation: knobRotation });
                switchMode(urlMode);
            }
            
            if (urlTrack && !isNaN(urlTrack)) {
                currentTrackIndex = Math.min(parseInt(urlTrack), musicData[currentMode].length - 1);
            }
        }
        
        // Enhanced visual effects
        function createParticleSystem() {
            const particleContainer = document.createElement('div');
            particleContainer.className = 'particle-system';
            particleContainer.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: -1;
            `;
            document.body.appendChild(particleContainer);
            
            // Create floating particles that respond to mode
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.cssText = `
                    position: absolute;
                    width: 4px;
                    height: 4px;
                    background: var(--primary-color);
                    border-radius: 50%;
                    opacity: 0.6;
                `;
                
                // Random position
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                
                particleContainer.appendChild(particle);
                
                // Animate particles
                gsap.to(particle, {
                    y: -window.innerHeight,
                    duration: Math.random() * 10 + 10,
                    repeat: -1,
                    ease: 'none',
                    delay: Math.random() * 5
                });
                
                gsap.to(particle, {
                    x: `+=${Math.random() * 200 - 100}`,
                    duration: Math.random() * 5 + 3,
                    repeat: -1,
                    yoyo: true,
                    ease: 'sine.inOut'
                });
            }
        }
        
        // Initialize the app
        loadFromURL();
        loadTrack();
        loadVideos(currentMode);
        updatePlayerTheme(currentMode);
        createParticleSystem();
        
        // Update URL when mode changes
        const originalSwitchMode = switchMode;
        switchMode = function(mode) {
            originalSwitchMode(mode);
            updateURL();
        };
        
        // Add some magnetic effect to the knob
        knob.addEventListener('mouseenter', () => {
            gsap.to(customCursor, {
                scale: 2,
                borderColor: 'var(--primary-color)',
                duration: 0.3
            });
        });
        
        knob.addEventListener('mouseleave', () => {
            gsap.to(customCursor, {
                scale: 1,
                borderColor: 'var(--chill-primary)',
                duration: 0.3
            });
        });
        
        // Video hover effects
        document.addEventListener('mouseenter', (e) => {
            if (e.target.closest('.video-wrapper')) {
                gsap.to(customCursor, {
                    scale: 3,
                    borderColor: 'var(--primary-color)',
                    duration: 0.3
                });
            }
        }, true);
        
        document.addEventListener('mouseleave', (e) => {
            if (e.target.closest('.video-wrapper')) {
                gsap.to(customCursor, {
                    scale: 1,
                    borderColor: 'var(--chill-primary)',
                    duration: 0.3
                });
            }
        }, true);
        
        // Add haptic feedback for mobile
        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }
        
        // Add audio feedback
        function playClickSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }
        
        // Add click sounds to mode transitions
        const originalUpdateMode = updateMode;
        updateMode = function(rotation) {
            const oldMode = currentMode;
            originalUpdateMode(rotation);
            if (oldMode !== currentMode) {
                playClickSound();
                triggerHaptic();
            }
        };
        
        console.log('🎵 Immersive Music Experience loaded successfully!');
        console.log('🎛️ Use the knob to switch between Chill, Dance, and Strange modes');
        console.log('🎵 Each mode has its own curated playlist and visual style');
    </script>
</body>
</html>
