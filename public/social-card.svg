<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>

    <!-- Audio wave pattern -->
    <pattern id="wavePattern" x="0" y="0" width="100" height="50" patternUnits="userSpaceOnUse">
      <path d="M0,25 Q25,5 50,25 T100,25" stroke="#ff6b6b" stroke-width="1" fill="none" opacity="0.3"/>
      <path d="M0,35 Q25,15 50,35 T100,35" stroke="#4ecdc4" stroke-width="1" fill="none" opacity="0.3"/>
      <path d="M0,45 Q25,25 50,45 T100,45" stroke="#ffe66d" stroke-width="1" fill="none" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#wavePattern)" opacity="0.1"/>

  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="80" fill="#ff6b6b" opacity="0.1"/>
  <circle cx="1050" cy="480" r="120" fill="#4ecdc4" opacity="0.1"/>
  <circle cx="1100" cy="200" r="60" fill="#ffe66d" opacity="0.1"/>

  <!-- Main content -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">
    TAIWO HEARD
  </text>

  <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#4ecdc4" letter-spacing="2px">
    AUDIO &#8226; DATA &#8226; R&amp;D
  </text>

  <text x="600" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#cccccc">
    Sound Design &#8226; Music Production &#8226; Creative Technology
  </text>

  <!-- Tagline -->
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888888">
    Building at the intersection of sound and creative technology
  </text>

  <!-- Website URL -->
  <text x="600" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ff6b6b" font-weight="bold">
    taiwoheard.com
  </text>

  <!-- Musical notes -->
  <g opacity="0.6">
    <text x="200" y="200" font-family="Arial, sans-serif" font-size="24" fill="#ffe66d">♪</text>
    <text x="900" y="250" font-family="Arial, sans-serif" font-size="20" fill="#4ecdc4">♫</text>
    <text x="300" y="500" font-family="Arial, sans-serif" font-size="18" fill="#ff6b6b">♪</text>
    <text x="1000" y="450" font-family="Arial, sans-serif" font-size="22" fill="#ffe66d">♫</text>
  </g>
</svg>
